name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      # Checagem estática anti-regressão: o client secret do Spotify só pode
      # viver no servidor (Supabase Auth + Edge Function), nunca em src/.
      - name: Guard against leaked Spotify client secret
        run: |
          if grep -rn "SPOTIFY_CLIENT_SECRET" src; then
            echo "::error::O client secret do Spotify não pode aparecer em src/ — vive apenas no servidor."
            exit 1
          fi
          echo "OK: nenhum client secret do Spotify em src/."
